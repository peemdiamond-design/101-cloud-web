<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>101 STUDIO | Retro Cloud Max</title>
    <!-- นำเข้าฟอนต์ 8-bit -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #1a1c29;
            color: #ff6b00;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* ลายตาราง 8-bit background */
            background-image: 
                linear-gradient(rgba(255, 107, 0, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 107, 0, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            text-shadow: 4px 4px 0px #000;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .window {
            background-color: #1a1c29;
            border: 4px solid #ff6b00;
            box-shadow: 8px 8px 0px #000;
            padding: 2px;
            margin-bottom: 20px;
            position: relative;
        }

        .window-header {
            background-color: #ff6b00;
            height: 20px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            margin-bottom: 20px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #000;
            margin-right: 5px;
        }
        .dot.red { background-color: #ff5f56; }
        .dot.yellow { background-color: #ffbd2e; }
        .dot.green { background-color: #27c93f; }

        h2 {
            font-size: 14px;
            color: #ff6b00;
            margin-bottom: 10px;
        }

        p {
            font-size: 10px;
            color: #ccc;
            margin-bottom: 20px;
        }

        /* --- ซ่อนส่วน Upload ทิ้งไป --- */
        .upload-box {
            display: none; 
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .sync-btn {
            background-color: #444;
            color: #fff;
            border: 2px solid #fff;
            padding: 5px 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 2px 2px 0px #000;
        }
        .sync-btn:hover { background-color: #666; }
        .sync-btn:active { transform: translate(2px, 2px); box-shadow: none; }

        .file-list {
            border: 2px solid #ff6b00;
            background-color: #000;
            height: 200px;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            margin-bottom: 20px;
            box-shadow: inset 4px 4px 0px #111;
        }

        .file-item {
            font-size: 10px;
            color: #0f0;
            margin-bottom: 15px;
            line-height: 1.5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-item a {
            color: #0f0;
            text-decoration: none;
            word-break: break-all;
        }
        .file-item a:hover {
            color: #fff;
            text-decoration: underline;
        }

        .logout-btn {
            width: 100%;
            background-color: transparent;
            color: #ff6b00;
            border: 2px solid #ff6b00;
            padding: 15px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            transition: all 0.2s;
        }
        .logout-btn:hover {
            background-color: #ff6b00;
            color: #000;
        }
        .logout-btn:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        /* --- หน้าจอ Login --- */
        #loginScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a1c29;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .login-box {
            border: 4px solid #ff6b00;
            padding: 30px;
            background-color: #000;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.5);
        }
        .login-box input {
            display: block;
            width: 90%;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #222;
            color: #0f0;
            border: 2px solid #ff6b00;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
        }
        .login-box button {
            width: 100%;
            padding: 15px;
            background-color: #ff6b00;
            color: #000;
            border: none;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
        }
        .login-box button:hover { background-color: #ff8c42; }

        /* Scrollbar สไตล์ 8-bit */
        ::-webkit-scrollbar { width: 12px; }
        ::-webkit-scrollbar-track { background: #000; border-left: 2px solid #ff6b00; }
        ::-webkit-scrollbar-thumb { background: #ff6b00; border: 2px solid #000; }
    </style>
</head>
<body>

    <!-- หน้าต่าง Login (ซ่อนไว้ก่อน) -->
    <div id="loginScreen">
        <div class="login-box window">
            <div class="window-header">
                <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
            </div>
            <h2>SYSTEM LOGIN</h2>
            <input type="email" id="emailInput" placeholder="> EMAIL_">
            <input type="password" id="passwordInput" placeholder="> PASSWORD_">
            <button onclick="login()">START SESSION</button>
            <p id="loginError" style="color: #ff5f56; margin-top: 10px; display: none;">> ERROR: ACCESS DENIED</p>
        </div>
    </div>

    <!-- หน้า Dashboard หลัก -->
    <div class="container" id="dashboardScreen" style="display: none;">
        <h1>101 STUDIO</h1>

        <div class="window">
            <div class="window-header">
                <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
            </div>
            
            <div style="padding: 20px;">
                <h2>DIRECTORY ACCESSED</h2>
                <p>CLOUD STORAGE FILES (READ-ONLY)</p>

                <div class="list-header">
                    <span style="font-size: 10px; color: #ff6b00;">> SEARCH FILE NAME...</span>
                    <button class="sync-btn" onclick="fetchFiles()">[SYNC]</button>
                </div>

                <div class="file-list" id="fileList">
                    > CONNECTING TO SERVER...
                </div>

                <button class="logout-btn" onclick="logout()">LOGOUT / DISCONNECT</button>
            </div>
        </div>

        <p style="font-size: 8px; color: #555;">© 101 STUDIO 2026</p>
    </div>

    <!-- ตั้งค่า Firebase ของคุณตรงนี้ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // *** เปลี่ยนตรงนี้ให้เป็น Config ของคุณจากเว็บ Firebase ***
        const firebaseConfig = {
          apiKey: "AIzaSyB...", // เอาของคุณมาใส่
          authDomain: "sever101studio.firebaseapp.com",
          projectId: "sever101studio",
          storageBucket: "sever101studio.appspot.com",
          messagingSenderId: "123...",
          appId: "1:123..."
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // URL เซิร์ฟเวอร์ Render ของคุณ
        const API_URL = 'https://sever101-backend.onrender.com';

        // ระบบ Login
        window.login = () => {
            const email = document.getElementById('emailInput').value;
            const pass = document.getElementById('passwordInput').value;
            signInWithEmailAndPassword(auth, email, pass)
                .catch(error => {
                    document.getElementById('loginError').style.display = 'block';
                });
        };

        // ระบบ Logout
        window.logout = () => {
            signOut(auth);
        };

        // เช็กสถานะการล็อกอิน
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
                fetchFiles(); // โหลดไฟล์เฉพาะตอนกดเข้ามาครั้งแรก
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('dashboardScreen').style.display = 'none';
            }
        });

        // ฟังก์ชันดึงรายชื่อไฟล์จาก Server (ไม่มี Auto Refresh แล้ว)
        window.fetchFiles = async () => {
            const listDiv = document.getElementById('fileList');
            listDiv.innerHTML = '> SYNCING DATA...';
            listDiv.style.color = '#ffbd2e';

            const user = auth.currentUser;
            if (!user) return;
            const token = await user.getIdToken();

            try {
                const response = await fetch(`${API_URL}/list-files`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!response.ok) throw new Error('SERVER BLOCKED ACCESS');
                
                const files = await response.json();
                listDiv.style.color = '#0f0';
                
                if (files.length === 0) {
                    listDiv.innerHTML = '> NO DATA MATCHES';
                    return;
                }

                listDiv.innerHTML = '';
                files.forEach(file => {
                    const item = document.createElement('div');
                    item.className = 'file-item';
                    // สร้างแค่ลิงก์สำหรับกดดูไฟล์ (ไม่มีปุ่มลบแล้ว)
                    item.innerHTML = `<a href="${file.webViewLink}" target="_blank">> ${file.name}</a>`;
                    listDiv.appendChild(item);
                });

            } catch (error) {
                listDiv.innerHTML = `> ERROR: ${error.message}`;
                listDiv.style.color = '#ff5f56';
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>101 STUDIO | Retro Cloud</title>
    <!-- นำเข้าฟอนต์สไตล์ Pixel 8-bit และฟอนต์สำหรับช่องพิมพ์ -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121528; /* สีพื้นหลังน้ำเงินเข้ม */
            --window-bg: #1a1e36; /* สีพื้นหลังในหน้าต่าง */
            --orange: #ff6b00; /* สีส้มเอกลักษณ์ของธีม */
            --text-light: #ffffff;
            --text-code: #56d364; /* สีเขียวสไตล์เขียนโค้ด */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            /* สร้างลายตารางพื้นหลังจางๆ ให้ดูเป็นหน้าจอเรโทร */
            background-image: linear-gradient(#1a1e36 2px, transparent 2px),
            linear-gradient(90deg, #1a1e36 2px, transparent 2px);
            background-size: 40px 40px;
        }

        header {
            margin-top: 50px;
            margin-bottom: 40px;
            text-align: center;
        }

        header h1 {
            color: var(--orange);
            font-size: 36px;
            text-shadow: 4px 4px 0px #000;
            letter-spacing: 2px;
        }

        /* กรอบหน้าต่าง OS แบบเรโทร */
        .window-container {
            background-color: var(--window-bg);
            border: 6px solid var(--orange);
            width: 90%;
            max-width: 650px;
            box-shadow: 15px 15px 0px rgba(0, 0, 0, 0.7);
            position: relative;
            margin-bottom: 40px;
        }

        /* แถบด้านบนหน้าต่าง (Title bar) */
        .window-top {
            background-color: var(--orange);
            height: 35px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 10px;
            border-bottom: 6px solid #000;
        }

        /* ปุ่ม 3 สี บนแถบหน้าต่าง */
        .dot {
            width: 16px;
            height: 16px;
            border: 2px solid #000;
            border-radius: 50%;
        }
        .dot.red { background-color: #ff5f56; }
        .dot.yellow { background-color: #ffbd2e; }
        .dot.green { background-color: #27c93f; }

        .window-content {
            padding: 40px;
            text-align: center;
        }

        h2 {
            color: var(--orange);
            font-size: 22px;
            margin-bottom: 20px;
            line-height: 1.5;
            text-shadow: 2px 2px 0px #000;
        }

        p.subtitle {
            font-family: 'VT323', monospace;
            font-size: 26px;
            color: #ccc;
            margin-bottom: 30px;
        }

        /* ช่องกรอกข้อมูลสไตล์เขียนโค้ด */
        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #000;
            border: 4px solid #444;
            color: var(--text-code);
            font-family: 'VT323', monospace;
            font-size: 24px;
            outline: none;
        }

        input:focus {
            border-color: var(--orange);
        }

        input::placeholder {
            color: #333;
        }

        /* ปุ่มกดสไตล์ 8-bit */
        button {
            width: 100%;
            padding: 18px;
            margin-bottom: 15px;
            background-color: var(--orange);
            color: #000;
            border: 4px solid #000;
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            cursor: pointer;
            box-shadow: inset -4px -4px 0px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        button:active {
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.5);
            transform: translateY(4px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--orange);
            border-color: var(--orange);
            box-shadow: none;
        }
        
        .btn-secondary:hover {
            background-color: rgba(255, 107, 0, 0.1);
        }

        .btn-secondary:active {
            box-shadow: inset 4px 4px 0px rgba(0,0,0,0.6);
        }

        .message {
            font-family: 'VT323', monospace;
            font-size: 22px;
            color: #ff5f56;
            margin-top: 15px;
            min-height: 26px;
        }

        /* ส่วนของแดชบอร์ดซ่อนไว้ก่อน */
        #dashboard-section {
            display: none;
        }

        /* กล่องแสดงรายชื่อไฟล์ */
        .file-list-container {
            margin-top: 5px;
            max-height: 350px;
            overflow-y: auto;
            text-align: left;
            background: #000;
            padding: 20px;
            border: 4px solid #444;
        }

        .file-item {
            font-family: 'VT323', monospace;
            font-size: 24px;
            margin-bottom: 15px;
            border-bottom: 2px dashed #333;
            padding-bottom: 10px;
        }

        .file-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .file-item a {
            color: var(--text-code);
            text-decoration: none;
        }

        .file-item a:hover {
            color: #000;
            background-color: var(--text-code);
        }

        /* ตกแต่ง Scrollbar ให้เข้าธีม */
        ::-webkit-scrollbar { width: 16px; }
        ::-webkit-scrollbar-track { background: #000; border-left: 4px solid #444; }
        ::-webkit-scrollbar-thumb { background: var(--orange); border: 4px solid #000; }

        footer {
            margin-top: auto;
            margin-bottom: 30px;
            font-family: 'VT323', monospace;
            font-size: 22px;
            color: #666;
        }
    </style>
</head>
<body>

    <header>
        <h1>101 STUDIO</h1>
    </header>

    <!-- หน้าต่างเข้าสู่ระบบ -->
    <div class="window-container" id="login-section">
        <div class="window-top">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
        </div>
        <div class="window-content">
            <h2>SYSTEM LOGIN</h2>
            <p class="subtitle">101 CLOUD STORAGE (5TB)</p>
            
            <input type="email" id="email" placeholder="USER_EMAIL@DOMAIN.COM" required>
            <input type="password" id="password" placeholder="PASSWORD" required>
            
            <button class="btn-primary" onclick="login()">START SESSION</button>
            <button class="btn-secondary" onclick="register()">REGISTER NEW USER</button>
            
            <div id="message" class="message"></div>
        </div>
    </div>

    <!-- หน้าต่างแดชบอร์ด -->
    <div class="window-container" id="dashboard-section">
        <div class="window-top">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
        </div>
        <div class="window-content">
            <h2>DIRECTORY ACCESSED</h2>
            <p class="subtitle">CLOUD STORAGE FILES</p>
            
            <!-- ช่องค้นหาข้อมูล -->
            <input type="text" id="search-input" placeholder="> SEARCH FILE NAME..." onkeyup="filterFiles()" style="margin-bottom: 15px; color: var(--orange);">
            
            <div class="file-list-container" id="file-list">
                <span style="color:var(--text-code);">> CONNECTING TO SERVER...</span>
            </div>
            
            <button class="btn-secondary" onclick="logout()" style="margin-top: 30px;">LOGOUT / DISCONNECT</button>
        </div>
    </div>

    <footer>© 101 STUDIO 2026</footer>

    <!-- เรียกใช้ Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <script>
        // ตั้งค่า Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAB0w2TumZGyuPzYK-5vClKXb0WXDlbTfs",
            authDomain: "sever101studio.firebaseapp.com",
            projectId: "sever101studio",
            storageBucket: "sever101studio.firebasestorage.app",
            messagingSenderId: "1006159064936",
            appId: "1:1006159064936:web:ab302487e05e6deb0970dd",
            measurementId: "G-22MHRNPMY9"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        // ตัวแปรสำหรับเก็บรายชื่อไฟล์ทั้งหมดที่ดึงมาจากเซิร์ฟเวอร์
        let allFiles = []; 

        // ระบบสร้างเสียงเอฟเฟกต์ 8-bit เมื่อกดปุ่ม
        function play8BitBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                // ใช้คลื่นเสียงแบบ 'square' เพื่อให้ได้ฟีลลิ่งเกม 8-bit เรโทร
                oscillator.type = 'square'; 
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime); 
                
                // ปรับระดับความดังและการเฟดเสียง
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } catch(e) {
                console.log("Web Audio API not supported");
            }
        }

        // ดักจับการกดปุ่มทั้งหมดในเว็บให้มีเสียง
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', play8BitBeep);
        });

        function showMessage(text, isError = true) {
            const msgEl = document.getElementById('message');
            msgEl.style.color = isError ? '#ff5f56' : '#27c93f';
            msgEl.textContent = text;
            setTimeout(() => msgEl.textContent = '', 5000);
        }

        function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return showMessage("> ERROR: PLEASE ENTER EMAIL & PASSWORD");
            
            auth.createUserWithEmailAndPassword(email, password)
                .then(() => showMessage("> REGISTRATION SUCCESS! PLEASE LOGIN", false))
                .catch(error => showMessage("> ERROR: " + error.message));
        }

        function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if(!email || !password) return showMessage("> ERROR: PLEASE ENTER EMAIL & PASSWORD");

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard-section').style.display = 'block';
                    fetchFiles(); 
                })
                .catch(error => showMessage("> ERROR: INVALID CREDENTIALS"));
        }

        function logout() {
            auth.signOut().then(() => {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('dashboard-section').style.display = 'none';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                document.getElementById('search-input').value = ''; // ล้างช่องค้นหา
            });
        }

        async function fetchFiles() {
            const fileListDiv = document.getElementById('file-list');
            fileListDiv.innerHTML = '<span style="color:#ccc;">> SYNCING SECURE DATA...</span>';
            
            try {
                // ดึงบัตรผ่านส่วนตัวของผู้ใช้
                const user = firebase.auth().currentUser;
                if (!user) throw new Error("NO ACTIVE USER");
                const token = await user.getIdToken(); 

                // ส่งคำขอไปที่เซิร์ฟเวอร์ Render
                const response = await fetch('https://sever101-backend.onrender.com/list-files', {
                    headers: {
                        'Authorization': `Bearer ${token}` 
                    }
                });
                
                if (!response.ok) {
                    throw new Error("SERVER BLOCKED ACCESS");
                }

                allFiles = await response.json(); // เก็บไฟล์ที่โหลดมา
                renderFiles(allFiles); // ส่งไฟล์ไปแสดงผล

            } catch (error) {
                fileListDiv.innerHTML = `<span style="color:#ff5f56;">> ERROR: ${error.message}</span>`;
            }
        }

        // ฟังก์ชันวาดรายการไฟล์ลงหน้าจอ
        function renderFiles(filesToDisplay) {
            const fileListDiv = document.getElementById('file-list');
            fileListDiv.innerHTML = ''; 

            if (filesToDisplay.length === 0) {
                fileListDiv.innerHTML = '<span style="color:#ccc;">> NO DATA MATCHES YOUR QUERY</span>';
                return;
            }

            filesToDisplay.forEach(file => {
                fileListDiv.innerHTML += `
                    <div class="file-item">
                        [FILE] <a href="${file.webViewLink}" target="_blank">${file.name}</a>
                    </div>
                `;
            });
        }

        // ฟังก์ชันกรองค้นหาไฟล์
        function filterFiles() {
            const searchKeyword = document.getElementById('search-input').value.toLowerCase();
            
            const filteredFiles = allFiles.filter(file => 
                file.name.toLowerCase().includes(searchKeyword)
            );
            
            renderFiles(filteredFiles);
        }
    </script>
</body>
</html>

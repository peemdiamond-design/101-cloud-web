<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>101 STUDIO | Retro Cloud Max</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121528; 
            --window-bg: #1a1e36; 
            --orange: #ff6b00; 
            --text-light: #ffffff;
            --text-code: #56d364; 
            --danger: #ff5f56;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Press Start 2P', cursive; 
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(#1a1e36 2px, transparent 2px), linear-gradient(90deg, #1a1e36 2px, transparent 2px);
            background-size: 40px 40px;
        }

        header { margin-top: 50px; margin-bottom: 40px; text-align: center; }
        header h1 { color: var(--orange); font-size: 36px; text-shadow: 4px 4px 0px #000; letter-spacing: 2px; }

        .window-container {
            background-color: var(--window-bg); border: 6px solid var(--orange);
            width: 90%; max-width: 700px; box-shadow: 15px 15px 0px rgba(0, 0, 0, 0.7); 
            position: relative; margin-bottom: 40px;
        }

        .window-top {
            background-color: var(--orange); height: 35px; display: flex; align-items: center;
            padding: 0 15px; gap: 10px; border-bottom: 6px solid #000;
        }

        .dot { width: 16px; height: 16px; border: 2px solid #000; border-radius: 50%; }
        .dot.red { background-color: #ff5f56; } .dot.yellow { background-color: #ffbd2e; } .dot.green { background-color: #27c93f; }

        .window-content { padding: 30px; text-align: center; }
        h2 { color: var(--orange); font-size: 20px; margin-bottom: 15px; text-shadow: 2px 2px 0px #000; }
        p.subtitle { font-family: 'VT323', monospace; font-size: 26px; color: #ccc; margin-bottom: 25px; }

        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%; padding: 15px; margin-bottom: 20px; background-color: #000; border: 4px solid #444;
            color: var(--text-code); font-family: 'VT323', monospace; font-size: 24px; outline: none;
        }
        input:focus { border-color: var(--orange); }

        button {
            width: 100%; padding: 15px; margin-bottom: 15px; background-color: var(--orange);
            color: #000; border: 4px solid #000; font-family: 'Press Start 2P', cursive;
            font-size: 14px; cursor: pointer; box-shadow: inset -4px -4px 0px rgba(0,0,0,0.3); transition: transform 0.1s;
        }
        button:active { box-shadow: inset 4px 4px 0px rgba(0,0,0,0.5); transform: translateY(4px); }
        .btn-secondary { background-color: transparent; color: var(--orange); border-color: var(--orange); box-shadow: none; }
        .btn-secondary:hover { background-color: rgba(255, 107, 0, 0.1); }
        .btn-danger { background-color: var(--danger); color: #fff; border-color: #000; margin: 0; padding: 10px; width: auto; font-size: 10px;}

        .message { font-family: 'VT323', monospace; font-size: 22px; color: #ff5f56; margin-top: 15px; min-height: 26px; }

        #dashboard-section { display: none; }

        /* โซนอัปโหลดไฟล์ */
        .upload-zone {
            background: #000; border: 4px dashed #444; padding: 20px; margin-bottom: 20px;
            display: flex; flex-direction: column; gap: 15px; align-items: center;
        }
        input[type="file"] {
            font-family: 'VT323', monospace; color: var(--text-light); font-size: 20px;
        }

        .file-list-container {
            max-height: 400px; overflow-y: auto; text-align: left; background: #000;
            padding: 20px; border: 4px solid #444;
        }

        .file-item {
            display: flex; align-items: center; justify-content: space-between; gap: 15px;
            font-family: 'VT323', monospace; font-size: 24px; margin-bottom: 15px;
            border-bottom: 2px dashed #333; padding-bottom: 15px;
        }
        .file-info { display: flex; align-items: center; gap: 15px; flex: 1; overflow: hidden; }
        .file-thumb { width: 50px; height: 50px; object-fit: cover; border: 2px solid var(--orange); }
        .file-icon { width: 50px; height: 50px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 14px; border: 2px solid #555; }
        .file-item a { color: var(--text-code); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;}
        .file-item a:hover { color: #000; background-color: var(--text-code); }

        ::-webkit-scrollbar { width: 16px; }
        ::-webkit-scrollbar-track { background: #000; border-left: 4px solid #444; }
        ::-webkit-scrollbar-thumb { background: var(--orange); border: 4px solid #000; }
        footer { margin-top: auto; margin-bottom: 30px; font-family: 'VT323', monospace; font-size: 22px; color: #666; }
    </style>
</head>
<body>

    <header><h1>101 STUDIO</h1></header>

    <div class="window-container" id="login-section">
        <div class="window-top"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
        <div class="window-content">
            <h2>SYSTEM LOGIN</h2><p class="subtitle">101 CLOUD STORAGE MAX</p>
            <input type="email" id="email" placeholder="USER_EMAIL" required>
            <input type="password" id="password" placeholder="PASSWORD" required>
            <button onclick="login()">START SESSION</button>
            <div id="message" class="message"></div>
        </div>
    </div>

    <div class="window-container" id="dashboard-section">
        <div class="window-top"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div>
        <div class="window-content">
            <h2>DIRECTORY ACCESSED</h2><p class="subtitle">CLOUD STORAGE FILES</p>
            
            <div class="upload-zone">
                <input type="file" id="file-upload" />
                <button onclick="uploadFile()" id="btn-upload" style="width: 80%;">UPLOAD TO CLOUD</button>
            </div>

            <input type="text" id="search-input" placeholder="> SEARCH FILE NAME..." onkeyup="filterFiles()" style="color: var(--orange);">
            
            <div class="file-list-container" id="file-list">
                <span style="color:var(--text-code);">> CONNECTING TO SERVER...</span>
            </div>
            
            <button class="btn-secondary" onclick="logout()" style="margin-top: 30px;">LOGOUT / DISCONNECT</button>
            <div id="dashboard-message" class="message"></div>
        </div>
    </div>

    <footer>© 101 STUDIO 2026</footer>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAB0w2TumZGyuPzYK-5vClKXb0WXDlbTfs",
            authDomain: "sever101studio.firebaseapp.com",
            projectId: "sever101studio",
            storageBucket: "sever101studio.firebasestorage.app",
            messagingSenderId: "1006159064936",
            appId: "1:1006159064936:web:ab302487e05e6deb0970dd",
            measurementId: "G-22MHRNPMY9"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        let allFiles = []; 
        const SERVER_URL = 'https://sever101-backend.onrender.com'; // ลิงก์ Render ของคุณ

        function play8BitBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'square'; oscillator.frequency.setValueAtTime(600, audioCtx.currentTime); 
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                oscillator.connect(gainNode); gainNode.connect(audioCtx.destination);
                oscillator.start(); oscillator.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }
        document.addEventListener('click', (e) => { if(e.target.tagName === 'BUTTON') play8BitBeep(); });

        function showMessage(text, isError = true, targetId = 'message') {
            const msgEl = document.getElementById(targetId);
            msgEl.style.color = isError ? '#ff5f56' : '#27c93f'; msgEl.textContent = text;
            setTimeout(() => msgEl.textContent = '', 5000);
        }

        function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('dashboard-section').style.display = 'block';
                    fetchFiles(); 
                }).catch(() => showMessage("> ERROR: INVALID CREDENTIALS"));
        }

        function logout() {
            auth.signOut().then(() => {
                document.getElementById('login-section').style.display = 'block';
                document.getElementById('dashboard-section').style.display = 'none';
            });
        }

        async function fetchFiles() {
            const fileListDiv = document.getElementById('file-list');
            fileListDiv.innerHTML = '<span style="color:#ccc;">> SYNCING SECURE DATA...</span>';
            try {
                const token = await firebase.auth().currentUser.getIdToken(); 
                const response = await fetch(`${SERVER_URL}/list-files`, { headers: { 'Authorization': `Bearer ${token}` }});
                if (!response.ok) throw new Error("SERVER BLOCKED ACCESS");
                allFiles = await response.json(); 
                renderFiles(allFiles); 
            } catch (error) { fileListDiv.innerHTML = `<span style="color:#ff5f56;">> ERROR: ${error.message}</span>`; }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('file-upload');
            if (!fileInput.files[0]) return showMessage("> PLEASE SELECT A FILE", true, 'dashboard-message');
            
            const btn = document.getElementById('btn-upload');
            btn.innerText = "UPLOADING..."; btn.disabled = true;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const token = await firebase.auth().currentUser.getIdToken();
                const response = await fetch(`${SERVER_URL}/upload`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData
                });
                if (!response.ok) throw new Error("UPLOAD FAILED");
                
                showMessage("> FILE UPLOADED SUCCESSFULLY", false, 'dashboard-message');
                fileInput.value = ''; 
                fetchFiles(); // รีเฟรชรายการไฟล์
            } catch (error) { showMessage(`> ERROR: ${error.message}`, true, 'dashboard-message'); }
            finally { btn.innerText = "UPLOAD TO CLOUD"; btn.disabled = false; }
        }

        async function deleteFile(fileId) {
            if(!confirm("ARE YOU SURE YOU WANT TO DELETE THIS FILE?")) return;
            try {
                const token = await firebase.auth().currentUser.getIdToken();
                const response = await fetch(`${SERVER_URL}/delete/${fileId}`, {
                    method: 'DELETE', headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error("DELETE FAILED");
                showMessage("> FILE DELETED", false, 'dashboard-message');
                fetchFiles();
            } catch (error) { showMessage(`> ERROR: ${error.message}`, true, 'dashboard-message'); }
        }

        function renderFiles(filesToDisplay) {
            const fileListDiv = document.getElementById('file-list');
            fileListDiv.innerHTML = ''; 
            if (filesToDisplay.length === 0) return fileListDiv.innerHTML = '<span style="color:#ccc;">> NO DATA MATCHES</span>';

            filesToDisplay.forEach(file => {
                const previewHtml = file.hasThumbnail 
                    ? `<img src="${file.thumbnailLink}" class="file-thumb">` 
                    : `<div class="file-icon">FILE</div>`;
                
                fileListDiv.innerHTML += `
                    <div class="file-item">
                        <div class="file-info">
                            ${previewHtml}
                            <a href="${file.webViewLink}" target="_blank">${file.name}</a>
                        </div>
                        <button class="btn-danger" onclick="deleteFile('${file.id}')">[DEL]</button>
                    </div>
                `;
            });
        }

        function filterFiles() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            renderFiles(allFiles.filter(file => file.name.toLowerCase().includes(keyword)));
        }
    </script>
</body>
</html>
